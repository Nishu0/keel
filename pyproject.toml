[project]
name = "keel"
version = "0.1.0"
description = "a durable runtime for agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.13.0",
  "croniter>=7.0.0",
  "cryptography>=50.0.2",
  "fastapi>=0.165.0",
  "jsonschema>=4.26.0",
  "mcp>=2.3.0",
  "pydantic[email]>=2.9",
  "pymongo>=4.10",
  "python-dotenv>=1.2.4",
  "stripe>=17.1.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
keel = "keel.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.23.1",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "apps/api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
